    svg.append('title').text(`${ex.name}: +1 주위 순 시계 방향 ${ex.count}회, 불안정 고유값 ${ex.count}개`);
    svg.append('rect').attr('data-chart-frame','').attr('x',margin.left).attr('y',margin.top)
      .attr('width',w-margin.left-margin.right).attr('height',h-margin.top-margin.bottom)
      .attr('fill','none').attr('stroke','var(--border)');
    svg.append('g').attr('transform',`translate(0,${h-margin.bottom})`).call(d3.axisBottom(x).ticks(w<400?3:6));
    svg.append('g').attr('transform',`translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5));
    svg.append('line').attr('x1',margin.left).attr('x2',w-margin.right).attr('y1',y(0)).attr('y2',y(0)).attr('stroke','var(--border)');
    svg.append('line').attr('y1',margin.top).attr('y2',h-margin.bottom).attr('x1',x(0)).attr('x2',x(0)).attr('stroke','var(--border)');
    const line = d3.line().x(p=>x(p[1])).y(p=>y(p[2]));
    svg.append('path').datum(points).attr('d',line).attr('fill','none').attr('stroke','var(--viz-series-1)').attr('stroke-width',2.5);
    svg.append('path').datum(points.map(p=>[p[0],p[1],-p[2]]).reverse()).attr('d',line)
      .attr('fill','none').attr('stroke','var(--viz-series-1)').attr('stroke-width',1.5).attr('stroke-dasharray','5 4');
    const defs = svg.append('defs');
    defs.append('marker').attr('id','nyquist-direction-arrow').attr('viewBox','0 -4 8 8')
      .attr('refX',7).attr('refY',0).attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto')
      .append('path').attr('d','M0,-3L7,0L0,3Z').attr('fill','var(--viz-series-1)');
    for (const target of [0.08,0.4]) {
      let k=d3.bisector(p=>p[0]).left(points,target); k=Math.max(2,Math.min(points.length-3,k));
      for (const sign of [1,-1]) {
        const a=points[k-2],b=points[k+2];
        const from=sign===1?a:b, to=sign===1?b:a;
        svg.append('line').attr('x1',x(from[1])).attr('y1',y(sign*from[2]))
          .attr('x2',x(to[1])).attr('y2',y(sign*to[2])).attr('stroke','var(--viz-series-1)')
          .attr('stroke-width',1.5).attr('marker-end','url(#nyquist-direction-arrow)');
      }
    }
    svg.append('path').attr('d',`M${x(1)-5},${y(0)-5}l10,10M${x(1)-5},${y(0)+5}l10,-10`)
      .attr('stroke','var(--foreground)').attr('stroke-width',2.5);
    svg.append('text').attr('x',x(1)+10).attr('y',y(0)-12).text('+1');
    svg.append('circle').attr('cx',x(points[0][1])).attr('cy',y(0)).attr('r',5)
      .attr('fill','var(--viz-series-2)').attr('data-tooltip',`정적 gain G = ${ex.gain.toFixed(3)}`);
    const p = points[Math.round(position * (points.length-1)/300)];
    svg.append('circle').attr('cx',x(p[1])).attr('cy',y(p[2])).attr('r',8)
      .attr('fill','none').attr('stroke','var(--foreground)').attr('stroke-width',2);
    svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',(margin.left+w-margin.right)/2)
      .attr('y',h-10).attr('text-anchor','middle').text('Re L₋₃(iω) · 무차원');
    svg.append('text').attr('class','axis-title').attr('data-axis','y')
      .attr('transform',`translate(18,${(margin.top+h-margin.bottom)/2}) rotate(-90)`)
      .attr('text-anchor','middle').text('Im L₋₃(iω) · 무차원');
    root.querySelector('#nyquist-frequency').textContent=p[0]===0?'0':p[0].toPrecision(3);
    root.querySelector('#nyquist-detail').textContent=`G = ${ex.gain.toFixed(3)} · +1 주위 순 시계 방향 ${ex.count}회 · 불안정 고유값 ${ex.count}개`;
    // Remove an optional critical-point label if it approaches the plot edge.
    svg.selectAll('text').filter(function(){return this.textContent==='+1';}).each(function(){
      const b=this.getBBox(); if(b.x+b.width>w-margin.right-4) d3.select(this).attr('x',x(1)-10).attr('text-anchor','end');
    });
  }
  applyState(window.openai && window.openai.widgetState);
  select.addEventListener('change',()=>{index=Number(select.value); position=0;slider.value='0';draw();save();});
  slider.addEventListener('input',()=>{position=Number(slider.value);draw();});
  slider.addEventListener('change',save);
  window.addEventListener('openai:set_globals',e=>{if(e.detail && e.detail.globals && e.detail.globals.widgetState){applyState(e.detail.globals.widgetState);draw();}});
  new ResizeObserver(draw).observe(root);
  draw();
})();
</script>
